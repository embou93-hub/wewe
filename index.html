<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InterFilm — Films & séries</title><style>:root{--bg:#080811;--p:#141423;--p2:#1d1d31;--txt:#f8f8ff;--mut:#aaaabd;--a:#8b5cf6;--b:#38bdf8;--line:#30304a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#25154d,transparent 35%),var(--bg);color:var(--txt);font:15px Arial,sans-serif}.header{position:sticky;top:0;z-index:3;background:#080811dd;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12}.nav{max-width:1250px;margin:auto;padding:16px 22px;display:flex;align-items:center;gap:28px}.logo{color:#fff;text-decoration:none;font-size:25px;font-weight:800}.logo span{color:var(--b)}.navlinks{display:flex;gap:18px;flex:1}.navlinks button,.ghost{background:none;border:0;color:var(--mut);cursor:pointer}.navlinks button:hover{color:#fff}.actions{display:flex;gap:8px}.ghost{border:1px solid var(--line);border-radius:10px;padding:10px 14px}.primary{border:0;border-radius:10px;background:linear-gradient(135deg,var(--a),#5b21b6);color:white;padding:11px 17px;font-weight:700;cursor:pointer}.hero{min-height:550px;display:flex;align-items:end;padding:70px max(22px,calc((100% - 1250px)/2));background:linear-gradient(90deg,#080811f5,#08081166,#080811),linear-gradient(135deg,#321660,#132b4b)}.hero h1{font-size:clamp(42px,7vw,88px);margin:12px 0}.hero p{max-width:560px;color:#d0d0dc;font-size:18px;line-height:1.55}.tag{color:#bdaaff;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:bold}.meta{color:var(--mut);margin:16px 0}.wrap{max-width:1250px;margin:auto;padding:44px 22px}.sectionhead{display:flex;justify-content:space-between}.sectionhead h2{font-size:25px}.sectionhead span{color:var(--b)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}.card{background:var(--p);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-5px);border-color:var(--a)}.poster{aspect-ratio:2/3;display:grid;place-items:center;font-size:42px;background:linear-gradient(145deg,#31205e,#143b55)}.cardbody{padding:12px}.card h3{font-size:15px;margin:0 0 6px}.card small{color:var(--mut)}.searchbar{display:flex;gap:10px;margin:25px 0}.searchbar input{flex:1;background:var(--p);border:1px solid var(--line);border-radius:10px;padding:13px;color:#fff}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.dialog{max-width:560px;width:100%;max-height:90vh;overflow:auto;background:var(--p2);border:1px solid var(--line);border-radius:18px;padding:26px}.dialog img{width:140px;border-radius:12px;float:left;margin:0 20px 15px 0}.dialog p{color:#c8c8d4;line-height:1.6}.close{float:right;background:none;border:0;color:white;font-size:25px}.footer{border-top:1px solid var(--line);padding:40px 22px;color:var(--mut);text-align:center}@media(max-width:750px){.nav{padding:13px 16px}.navlinks{display:none}.hero{min-height:500px;padding:40px 20px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.poster{font-size:30px}}</style></head><body><header class="header"><nav class="nav"><a class="logo" href="#">Inter<span>Film</span></a><div class="navlinks"><button data-view="home">Accueil</button><button data-view="catalogue">Catalogue</button><button data-view="top">Top 10</button><button data-view="list">Ma liste</button><button data-view="faq">FAQ</button></div><div class="actions"><button class="ghost" id="searchBtn">⌕</button></div></nav></header><main id="app"></main><div class="modal" id="modal"><div class="dialog"><button class="close" id="close">×</button><div id="modalContent"></div></div></div><footer class="footer">InterFilm — Films & séries 100% gratuits<br><small>Version autonome sans abonnement ni contenu TV.</small></footer><script>
const movies=[{id:1,title:'Le Dernier Horizon',type:'Film',year:2026,genre:'Science-fiction',emoji:'🚀',desc:'Une mission impossible aux confins de la galaxie.'},{id:2,title:'Nuit Électrique',type:'Film',year:2025,genre:'Action',emoji:'⚡',desc:'Une course contre la montre dans une ville sous tension.'},{id:3,title:'Les Héritiers',type:'Série',year:2026,genre:'Drame',emoji:'👑',desc:'Une famille se déchire autour d’un empire.'},{id:4,title:'Zone Blanche',type:'Série',year:2025,genre:'Thriller',emoji:'❄️',desc:'Un village isolé cache un secret inquiétant.'},{id:5,title:'Cœurs Sauvages',type:'Film',year:2024,genre:'Romance',emoji:'💜',desc:'Deux inconnus, une rencontre et un nouveau départ.'},{id:6,title:'Code Fantôme',type:'Film',year:2026,genre:'Thriller',emoji:'🕶️',desc:'Un ancien hacker revient pour sauver son équipe.'},{id:7,title:'Planète Océan',type:'Série',year:2025,genre:'Documentaire',emoji:'🌊',desc:'Les mondes fascinants cachés sous les vagues.'},{id:8,title:'Minuit à Paris',type:'Film',year:2023,genre:'Comédie',emoji:'🌃',desc:'Une nuit qui ne se déroulera jamais comme prévu.'},{id:9,title:'Les Veilleurs',type:'Série',year:2024,genre:'Fantastique',emoji:'🔮',desc:'Ils protègent notre monde sans que personne ne le sache.'},{id:10,title:'Dernier Virage',type:'Film',year:2025,genre:'Sport',emoji:'🏎️',desc:'La dernière course peut tout changer.'}];let list=JSON.parse(localStorage.getItem('interfilm-list')||'[]'),view='home';const app=document.getElementById('app');function card(m){return `<article class="card" data-id="${m.id}"><div class="poster">${m.emoji}</div><div class="cardbody"><h3>${m.title}</h3><small>${m.type} · ${m.year} · ${m.genre}</small></div></article>`}function render(){let c='';if(view==='home')c=`<section class="hero"><div><div class="tag">InterFilm · Films & séries</div><h1>Le cinéma, autrement.</h1><p>Découvre des films et des séries, crée ta liste et trouve ton prochain programme.</p><div class="meta">VF · HD · Catalogue en évolution</div><button class="primary" id="heroBtn">Voir le catalogue</button></div></section><div class="wrap"><div class="sectionhead"><h2>Nouveautés <span>InterFilm</span></h2></div><div class="grid">${movies.slice(0,6).map(card).join('')}</div></div>`;if(view==='catalogue')c=`<div class="wrap"><h1>Catalogue films & séries</h1><div class="searchbar"><input id="filter" placeholder="Rechercher un titre, un genre…"></div><div class="grid" id="results">${movies.map(card).join('')}</div></div>`;if(view==='top')c=`<div class="wrap"><div class="tag">Classement de la semaine</div><h1>Top 10 films & séries</h1><div class="grid">${movies.map((m,i)=>card({...m,title:`${i+1}. ${m.title}`})).join('')}</div></div>`;if(view==='list')c=`<div class="wrap"><h1>Ma liste</h1><div class="grid">${list.length?list.map(id=>movies.find(m=>m.id===id)).filter(Boolean).map(card).join(''):'<p class="empty">Ta liste est vide. Ajoute des titres depuis leur fiche.</p>'}</div></div>`;if(view==='faq')c=`<div class="wrap"><div class="tag">Centre d’aide</div><h1>Questions fréquentes</h1><div class="dialog" style="max-width:none"><h2>Comment fonctionne InterFilm ?</h2><p>Cette version présente des films et des séries dans une interface autonome.</p><h2>Comment ajouter un titre ?</h2><p>Ouvre sa fiche puis clique sur « Ajouter à ma liste ».</p><h2>Y a-t-il des chaînes TV ?</h2><p>Non. InterFilm est consacré uniquement aux films et aux séries.</p></div></div>`;app.innerHTML=c;bind()}function bind(){document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openMovie(+x.dataset.id));document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{view=x.dataset.view;render()});document.getElementById('heroBtn')?.addEventListener('click',()=>{view='catalogue';render()});document.getElementById('filter')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.getElementById('results').innerHTML=movies.filter(m=>(m.title+' '+m.genre+' '+m.type).toLowerCase().includes(q)).map(card).join('');bind()})}function openMovie(id){let m=movies.find(x=>x.id===id),saved=list.includes(id);document.getElementById('modalContent').innerHTML=`<h2>${m.title}</h2><p>${m.type} · ${m.year} · ${m.genre}</p><p>${m.desc}</p><button class="primary" id="watch">▶ Voir la fiche</button> <button class="ghost" id="save">${saved?'Retirer de ma liste':'Ajouter à ma liste'}</button>`;document.getElementById('modal').classList.add('open');document.getElementById('save').onclick=()=>{list=saved?list.filter(x=>x!==id):[...list,id];localStorage.setItem('interfilm-list',JSON.stringify(list));openMovie(id)}}document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.getElementById('searchBtn').onclick=()=>{view='catalogue';render();setTimeout(()=>document.getElementById('filter')?.focus(),0)};render();</script></body></html>
